name: Speech model - test Tarteel Whisper

# While CAIR is offline: tests Tarteel's open Quran Whisper models (tiny and base) on real recitations.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg
          pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers==4.46.3" librosa
      - name: Test the models
        shell: bash
        run: |
          set -o pipefail
          python -u tools/asr/whisper_eval.py 2>&1 | tee whisper-log.txt
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: whisper-report
          path: |
            whisper-report.txt
            whisper-log.txt
