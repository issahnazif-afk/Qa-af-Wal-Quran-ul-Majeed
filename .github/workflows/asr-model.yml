name: Speech model - export and test

# Converts the open Arabic Conformer-CTC speech model to ONNX (to run on the phone and in the browser)
# and measures its accuracy and speed on real recitations. Run it from Actions → Run workflow.
# Results: the run log, and the "qaaf-asr-model" artifact (model files + report.txt).
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg libsndfile1
          pip install --upgrade pip
          pip install torch==2.5.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install "nemo_toolkit[asr]==2.5.3" onnx onnxruntime librosa "pyarrow<18" "datasets<4"
          python -c "import numpy, pyarrow; print('numpy', numpy.__version__, 'pyarrow', pyarrow.__version__)"
      - name: Export and test
        run: python tools/asr/export_and_evaluate.py 2>&1 | tee asr-out-log.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: qaaf-asr-model
          path: |
            asr-out/
            asr-out-log.txt
