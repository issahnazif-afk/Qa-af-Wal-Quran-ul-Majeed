name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project zip
        run: |
          unzip -q Qa-af-Wal-Quran-ul-Majeed.zip -d _unzip
          ROOT=$(dirname "$(find _unzip -name package.json -not -path '*/node_modules/*' | head -n 1)")
          echo "Project folder found at: $ROOT"
          cp -r "$ROOT"/. .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build data
        run: npm run data
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      - name: Build site
        run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
