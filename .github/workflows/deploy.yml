name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 1 * *'   # monthly refresh of the data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Get the trained speech model (if published)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/models
          gh release download qaaf-asr-model -D public/models -p 'qaaf-asr.onnx' -p 'features.json' -p 'vocab.json' --clobber || echo "No speech model published yet"
      - name: Build data
        run: npm run data
        env:
          QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
          QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      - name: Build site
        run: npm run build:site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
